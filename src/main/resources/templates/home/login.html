<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>
</head>
<body>
<h2>ยินดีต้อนรับเข้าสู่ระบบ</h2>
<form th:action="@{/officer}" method="post">
  <label>Username / ชื่ออผู้ใช้งาน</label>
  <input type="text" name="username" required/><br/>
  <label>Password / รหัสผ่าน</label>
  <input type="password" name="password" required /><br/>
  <button type="submit">เข้าสู่ระบบ</button>
</form>

<div th:if="${param.error}">
  <p>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</p>
</div>

<p>ยังไม่มีบัญชีใช่หรือไม่?  <a th:href="@{/register}">กดสมัครสมาชิกที่นี่</a></p>
</body>
</html>
