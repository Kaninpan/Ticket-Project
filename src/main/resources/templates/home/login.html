<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" type="text/css" href="/css/stylehome.css">
  <script src="/js/stylehome.js"></script>
</head>
<body>
<div class="login-container">
  <h2>ยินดีต้อนรับเข้าสู่ระบบ</h2>
  <form th:action="@{/officer}" method="post" onsubmit="return validateForm()">
    <div class="form-group">
      <label for="username">Username / ชื่อผู้ใช้งาน</label>
      <input type="text" id="username" name="username" placeholder="กรุณากรอกชื่อผู้ใช้ (Username)" required/>
    </div>
    <div class="form-group">
      <label for="password">Password / รหัสผ่าน</label>
      <input type="password" id="password" name="password" placeholder="กรุณากรอกรหัสผ่าน (Password)" required />
    </div>
    <div class="form-group">
      <button type="submit">เข้าสู่ระบบ</button>
    </div>

    <div id="error-message" class="error-message" th:if="${param.error}">
    <p th:if="${success}" class="success-message" th:text="${success}"></p>
      <p>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</p>
    </div>

    <p class="register-link">ยังไม่มีบัญชีใช่หรือไม่?
      <a th:href="@{/register}">กดสมัครสมาชิกที่นี่</a>
    </p>
  </form>

<!--hidden javascript -->
  <div id="clock" hidden></div>
  <button id="myButton" hidden>Click Me!</button>
  <div id="logoutAlert" class="d-none" hidden>
    <button id="logoutButton" hidden>Logout</button>
    <button id="confirmButton" hidden>Yes</button>
    <button id="cancelButton" hidden>Cancel</button>
  </div>
  <!--hidden javascript -->

</div>
</body>
</html>
