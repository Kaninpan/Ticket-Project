<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" type="text/css" href="/css/stylehome1.css">
  <script src="/js/stylehome.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="header d-flex align-items-center justify-content-between px-3">
  <button class="toggle-sidebar-btn btn btn-light">☰</button>
  <h1 class="h5 mb-0"><b>ระบบแจ้งปัญหาการใช้งาน</b></h1>
</div>
<div>
  <div th:replace="~{fragments/mmenubar :: mmenubar}"></div>
</div>

<div class="content">
  <form th:action="@{/editprofile}" th:object="${user}" method="post" class="profile-form">
    <h2>แก้ไขโปรไฟล์</h2>


    <div class="form-row">
      <div class="form-group col">
        <label for="username">ชื่อผู้ใช้งาน / Username</label>
        <input type="text" id="username" th:field="*{username}" required disabled/>
      </div>
      <div class="form-group col">
        <label for="email">อีเมล</label>
        <input type="text" id="email" th:field="*{email}" required disabled/>
      </div>
    </div>


    <div class="form-row">
      <div class="form-group col">
        <label for="firstName">ชื่อ</label>
        <input type="text" id="firstName" th:field="*{firstName}" required/>
      </div>
      <div class="form-group col">
        <label for="lastName">นามสกุล</label>
        <input type="text" id="lastName" th:field="*{lastName}" required/>
      </div>
      <div class="form-group col">
        <label for="phoneNumber">เบอร์โทร</label>
        <input type="text" id="phoneNumber" th:field="*{phoneNumber}" maxlength="12" oninput="formatPhone(this)" required/>
      </div>
    </div>

    <div class="form-group">
      <p class="note">หากต้องการแก้ไขรหัสผ่าน สามารถตั้งรหัสผ่านใหม่ได้ที่นี่</p>
      <label for="password">ตั้งรหัสผ่าน</label>
      <input type="password" id="password" th:field="*{password}"
             placeholder="กรุณากรอกรหัสผ่าน (Password) ของท่าน"
             pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}"
             title="รหัสผ่านต้องมีตัวอักษรภาษาอังกฤษพิมพ์ใหญ่ 1 ตัว, อักขระพิเศษ 1 ตัว, ตัวเลข, และต้องมีความยาว 8 ตัวขึ้นไป." />
    </div>

    <div class="form-group">
      <input type="submit" value="แก้ไขข้อมูล" class="submit-button" onclick="showConfirmModal(event)"/>
      <a href="/home" class="secondary-button">ย้อนกลับ</a>
    </div>
  </form>
</div>




<!--===============================================Alert Popup Edit ================================================-->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">ยืนยันการแก้ไขข้อมูล</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="confirmModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="confirmEdit()">ตกลง</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">ยกเลิก</button>
      </div>
    </div>
  </div>
</div>
<!--================================================================================================================-->


  <div class="alert alert-success" th:if="${success}">
    <p th:text="${success}"></p>
  </div>
</div>
</body>
</html>
