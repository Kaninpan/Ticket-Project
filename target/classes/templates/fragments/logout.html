<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" href="/css/stylehome.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:fragment="logout">
    <form th:action="@{/editprofile}" method="get" class="mb-3">
        <button type="submit" class="btn btn-primary w-100">แก้ไขโปรไฟล์</button>
    </form>

    <form id="logoutForm" th:action="@{/logout}" method="post">
        <button type="button" class="btn btn-danger w-100" id="logoutButton">ออกจากระบบ</button>
    </form>
    <!-- Custom Alert -->
    <div class="alert alert-dark d-none" id="logoutAlert">
        <span>ต้องการออกจากระบบ?</span>
        <button class="btn btn-success btn-sm" id="confirmButton">😞 ตกลง</button>
        <button class="btn btn-danger btn-sm" id="cancelButton">😊 ยกเลิก</button>
    </div>
    <!-- Custom Alert -->


</div>
</body>
</html>
