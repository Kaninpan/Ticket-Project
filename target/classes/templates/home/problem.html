<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งปัญหาการใช้งาน</title>
  <link rel="stylesheet" type="text/css" href="/css/stylehome1.css">
  <script src="/js/stylehome.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="header d-flex align-items-center justify-content-between px-3">
  <button class="toggle-sidebar-btn btn btn-light">☰</button>
  <h1 class="h5 mb-0"><b>ระบบแจ้งปัญหาการใช้งาน</b></h1>
</div>
<div>
  <div th:replace="~{fragments/mmenubar :: mmenubar}"></div>
</div>

<div class="content">
  <h2>แจ้งปัญหาการใช้งาน</h2>
  <p>โปรดกรอกรายละเอียดปัญหาที่เกิดขึ้นจากการใช้งานให้ครบถ้วน</p>

  <div class="alert alert-success alert-dismissible fade show" th:if="${success}" id="successAlert">
    <p th:text="${success}"></p>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <form th:action="@{/problem}" th:object="${report}" method="post" enctype="multipart/form-data" id="reportForm">

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="firstName" class="form-label">ชื่อ</label>
        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" readonly>
      </div>
      <div class="col-md-6">
        <label for="lastName" class="form-label">นามสกุล</label>
        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" readonly>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="phone" class="form-label">เบอร์โทร</label>
        <input type="text" class="form-control" id="phone" th:field="*{phone}" readonly>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">อีเมล</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" readonly>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="issueType" class="form-label">ประเภทปัญหา</label>
        <select class="form-select" th:field="*{issueType}">
          <option th:each="type : ${issueTypes}" th:value="${type}" th:text="${type}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="imageFile" class="form-label">แนบรูปภาพ (ถ้ามี)</label>
        <input class="form-control" type="file" id="imageFile" name="imageFile" accept="image/*">
      </div>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">รายละเอียดปัญหา</label>
      <textarea class="form-control" id="description" th:field="*{description}" rows="4" required></textarea>
    </div>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#confirmationModal">ส่งข้อมูล</button>

    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmationModalLabel">ยืนยันการส่งข้อมูล</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="modalMessage"></div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary" id="confirmSubmit">ตกลง</button>
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal" aria-label="Close">ยกเลิก</button>
          </div>
        </div>
      </div>


  </form>
</div>



</div>
</body>
</html>
