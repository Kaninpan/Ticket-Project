<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการแจ้งปัญหาการใช้งาน</title>
    <link rel="stylesheet" type="text/css" href="/css/stylehome1.css">
    <script src="/js/stylehome.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="header d-flex align-items-center justify-content-between px-3">
    <button class="toggle-sidebar-btn btn btn-light">☰</button>
    <h1 class="h5 mb-0"><b>ระบบแจ้งปัญหาการใช้งาน</b></h1>
</div>
<div>
    <div th:replace="~{fragments/mmenubar :: mmenubar}"></div>
</div>

<div class="content">
    <h2>รายงานการแจ้งปัญหาการใช้งาน</h2>

    <!-- Table Section -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ชื่อ</th>
                <th>ประเภทปัญหา</th>
                <th>รายละเอียด</th>
                <th>สถานะ</th>
                <th>วันที่แจ้ง</th>
                <th>รูปภาพ</th> <!-- เพิ่มคอลัมน์นี้สำหรับแสดงรูปภาพ -->
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${problems}">
                <td th:text="${item.firstName + ' ' + item.lastName}"></td>
                <td th:text="${item.issueType}"></td>
                <td th:text="${item.description}"></td>
                <td>
                    <span th:switch="${item.statusProblem}">
                        <span th:case="1" class="badge bg-warning text-dark" style="font-weight: normal; font-size: 1rem;">ปัญหาที่รอการแก้ไข</span>
                        <span th:case="2" class="badge bg-info text-dark" style="font-weight: normal; font-size: 1rem;">ปัญหาที่กำลังดำเนินการ</span>
                        <span th:case="3" class="badge bg-success" style="font-weight: normal; font-size: 1rem;">ปัญหาที่แก้ไขเสร็จสิ้น</span>
                    </span>
                </td>
                <td th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <!-- ปุ่ม "แสดงรูปภาพ" -->
                    <button th:if="${item.profileImage != null and item.profileImage != ''}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#imageModal" th:data-image="@{/uploads/{file}(file=${item.profileImage})}">
                        แสดงรูปภาพ
                    </button>
                    <span th:unless="${item.profileImage != null and item.profileImage != ''}">
                        ไม่ได้แนบรูปมาให้
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal for Image Display -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">รูปภาพ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="modalImage" src="" alt="Large Image" class="img-fluid" />
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
