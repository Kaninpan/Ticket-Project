<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการแจ้งปัญหาการใช้งาน</title>
    <link rel="stylesheet" type="text/css" href="/css/stylehome1.css">
    <script src="/js/stylehome.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="header d-flex align-items-center justify-content-between px-3">
    <button class="toggle-sidebar-btn btn btn-light">☰</button>
    <h1 class="h5 mb-0"><b>ระบบแจ้งปัญหาการใช้งาน</b></h1>
</div>
<div>
    <div th:replace="~{fragments/mmenubar :: mmenubar}"></div>
</div>

<div class="content">
    <h2>รายงานการแจ้งปัญหาการใช้งาน</h2>

    <div class="d-flex justify-content-end mb-3 mt-3 align-items-center">
        <label for="searchInput" class="me-2 mb-0">ค้นหา : </label>
        <input type="text" id="searchInput" class="form-control w-50" style="max-width: 400px; height: 38px;" placeholder="ค้นหาชื่อหรือประเภทปัญหา..." onkeyup="searchData()">
        <select id="statusFilter" class="form-control ms-2 w-50" style="max-width: 250px; height: 38px;" onchange="filterStatus()">
            <option value="">ทั้งหมด</option>
            <option value="1">ปัญหาที่รอการแก้ไข</option>
            <option value="2">ปัญหาที่กำลังดำเนินการ</option>
            <option value="3">ปัญหาที่แก้ไขเสร็จสิ้น</option>
        </select>
    </div>

    <div class="table-responsive">
        <div id="resultCount" class="mb-3 text-muted">มีทั้งหมด 0 รายการ</div>
        <table class="table table-bordered table-hover align-middle" id="problemsTable">
            <thead class="table-light">
            <tr>
                <th>ลำดับ</th>
                <th>ชื่อ</th>
                <th>ประเภทปัญหา</th>
                <th>รายละเอียด</th>
                <th>รูปภาพ</th>
                <th>สถานะ</th>
                <th>วันที่แจ้ง</th>
            </tr>
            </thead>
            <tbody id="problemsTbody">
            <tr th:each="item, iterStat : ${problems}" class="problem-row">
                <td th:text="${iterStat.count}" class="text-center"></td>
                <td th:text="${item.firstName + ' ' + item.lastName}"></td>
                <td th:text="${item.issueType}"></td>
                <td th:text="${item.description}"></td>
                <td>
                    <button th:if="${item.profileImage != null and item.profileImage != ''}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#imageModal" th:data-image="@{/uploads/{file}(file=${item.profileImage})}">
                        แสดงรูปภาพ
                    </button>
                    <span th:unless="${item.profileImage != null and item.profileImage != ''}">ไม่ได้แนบรูปมาให้</span>
                </td>
                <td>
                    <span th:switch="${item.statusProblem}">
                        <span th:case="1" class="badge bg-warning text-dark status-badge" style="font-weight: normal; font-size: 1rem;">ปัญหาที่รอการแก้ไข</span>
                        <span th:case="2" class="badge bg-info text-dark status-badge" style="font-weight: normal; font-size: 1rem;">ปัญหาที่กำลังดำเนินการ</span>
                        <span th:case="3" class="badge bg-success status-badge" style="font-weight: normal; font-size: 1rem;">ปัญหาที่แก้ไขเสร็จสิ้น</span>
                    </span>
                </td>
                <td th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            </tbody>

        </table>
    </div>

    <div id="pagination" class="d-flex justify-content-center mt-3"></div>

    <!-- Modal for Image Display -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">รูปภาพ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="modalImage" src="" alt="Large Image" class="img-fluid" />
                </div>
            </div>
        </div>
    </div>
</div>

<script>


</body>
</html>
